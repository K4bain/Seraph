name: seraph

services:
  postgres:
    image: apache/age:latest
    container_name: seraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seraph
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./prisma/graph/age-init.sql:/docker-entrypoint-initdb.d/01-age-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seraph -d seraph"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: seraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: seraph-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: seraph
      MINIO_ROOT_PASSWORD: seraph-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
