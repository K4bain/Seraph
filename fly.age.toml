# ================================================================
# seraph-age — Apache AGE Postgres on Fly.io (private, persistent)
# Persistent graph store for the AGE import bridge. Internal-only:
# seraph-app reaches it via seraph-age.internal:5432. Never expose
# this app publicly.
# Deploy: fly deploy -c fly.age.toml
# First-time data volume: fly volumes create age_data -a seraph-age -s 1 -r del
# ================================================================
app = "seraph-age"
primary_region = "del"

[build]
  image = "apache/age:latest"

[env]
  POSTGRES_USER = "postgres"
  POSTGRES_PASSWORD = "password"
  POSTGRES_DB = "meridian"

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"

# Never suspend a database.
min_machines_running = 1

# PostgreSQL is TCP-only, reachable from the private network.
[[services]]
  protocol = "tcp"
  internal_port = 5432
  internal_only = true
  auto_stop_machines = "off"
  auto_start_machines = true

[mounts]
  source = "age_data"
  destination = "/var/lib/postgresql/data"
