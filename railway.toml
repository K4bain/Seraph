# ================================================================
# Seraph — main Next.js app service (Railway config-as-code).
# Railway reads this file for the service whose root directory is
# the repo root. Other services carry their own config in
# services/<name>/railway.toml.
# ================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
